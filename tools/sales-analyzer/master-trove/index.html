        .radio-group,

        }

        .radio-item,
        .checkbox-item {

            align-items: flex-start;
            gap: 10px;
        }

        input[type="radio"],

            margin-top: 3px;
            cursor: pointer;
            accent-color: #7c3aed;
        }

        .radio-item label,
        .checkbox-item label {
            margin-bottom: 0;

            cursor: pointer;
            flex: 1;
        }

        .button-container {
            text-align: center;
            margin: 40px 0 0;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #6d28d9;
        }

        button:active {
            background: #5b21b6;
        }

        .back-link {

        }

        .success-state {

        }

        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f0f0f0;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;

        @keyframes spin {
