<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Builder - The AI Shift</title>

  <!-- Short, retypeable link for the video.

       Without YouTube Advanced verification the description link renders as
       plain text, so a viewer has to type it. Nobody retypes a 120-character
       UTM'd URL; theaishift.biz/prompt they will. Attribution survives because
       the UTM tags live on the redirect TARGET, not on the link they type.

       utm_medium=shortlink, deliberately not "description": this is typed
       traffic, and folding it into the description metric would overstate how
       many people actually clicked. -->
  <link rel="canonical" href="https://theaishift.biz/tools/prompt-builder/master-trove/">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=https://theaishift.biz/tools/prompt-builder/master-trove/?utm_source=youtube&amp;utm_medium=shortlink&amp;utm_campaign=video01-prompt-builder">

  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f8f7ff; color: #374151;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center; padding: 24px;
    }
    .eyebrow { color: #7c3aed; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
    p { font-size: 16px; line-height: 1.6; margin: 0 0 20px; }
    a { color: #7c3aed; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">The AI Shift</p>
    <!-- Visible fallback: meta refresh is blocked in some browsers and by some
         corporate proxies, and this page has no other content to fall back to. -->
    <p>Taking you to the Prompt Builder&hellip;</p>
    <p><a href="https://theaishift.biz/tools/prompt-builder/master-trove/?utm_source=youtube&amp;utm_medium=shortlink&amp;utm_campaign=video01-prompt-builder">Continue to the Prompt Builder</a></p>
  </main>
  <script>
    // replace() rather than assignment, so Back returns to the video instead of
    // bouncing through this page again.
    location.replace('https://theaishift.biz/tools/prompt-builder/master-trove/?utm_source=youtube&utm_medium=shortlink&utm_campaign=video01-prompt-builder');
  </script>
</body>
</html>
